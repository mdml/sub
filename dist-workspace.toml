[workspace]
members = ["cargo:."]

# Config for 'dist' (cargo-dist). Rationale: docs/decisions/2026-08-27-release-tooling.md
# and docs/release.md. Publishing is dispatch-only for stable releases;
# nightly prereleases already exist and use a separate workflow.
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax). Windows is out of scope.
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Checksums for every artifact
checksum = "sha256"
# Sign and attest artifacts with GitHub artifact attestations (Sigstore, keyless)
github-attestations = true
# Stable promotion creates its tag over SSH with the release deploy key and
# explicitly dispatches this workflow so nightly tags never invoke cargo-dist.
dispatch-releases = true
# Nightlies use their own GitHub-prerelease workflow; package-manager publishing
# is reserved for stable cargo-dist tags.
publish-prereleases = false
# Homebrew tap that receives the generated formula. The tap repository must
# exist and a HOMEBREW_TAP_TOKEN secret must be set before the first release.
tap = "mdml/homebrew-tap"
publish-jobs = ["homebrew"]
