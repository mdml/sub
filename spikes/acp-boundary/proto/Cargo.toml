[package]
name = "acp-delegate"
version = "0.0.0"
edition = "2024"
publish = false
description = "Disposable spike prototype: delegate one task to an ACP agent and capture the evidence."

# Standalone: keep this crate out of any workspace that may appear at the repo root.
[workspace]

[dependencies]
agent-client-protocol = { version = "2.0.0", features = ["unstable_end_turn_token_usage"] }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
