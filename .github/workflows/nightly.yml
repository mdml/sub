# GitHub nightly: vulnerability and dependency-freshness checks.
# The on-machine harness-compatibility nightly is documented under docs/nightlies/
# and is not run here.
name: nightly

on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check advisories

  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - name: Report dependencies with newer compatible versions (informational; does not modify Cargo.lock)
        run: cargo update --dry-run
      - name: Report pinned GitHub Actions
        run: grep -rn "uses:" .github/workflows | sort -u
