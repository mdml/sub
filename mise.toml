# Developer tools for this repository, pinned. `mise install` provisions them
# into mise's own directories; nothing here touches system packages.
# The Rust toolchain itself is pinned by rust-toolchain.toml (rustup).
[tools]
just = "1.58.0"
"cargo:cargo-llvm-cov" = "0.8.7"
"cargo:cargo-deny" = "0.20.2"
